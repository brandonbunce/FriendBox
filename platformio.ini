; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc1-n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv

; LovyanGFX and ArduinoJson live under components/ as IDF components,
; pulled in via src/CMakeLists.txt REQUIRES. Disable PIO's library
; auto-discovery so it doesn't try to compile lib/Panel_PCBA5981 or
; cached Arduino-flavored libs as PIO libraries — those are wired
; through the IDF component system instead.
lib_ldf_mode = off
